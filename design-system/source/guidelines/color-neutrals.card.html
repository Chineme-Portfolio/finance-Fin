<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="Backgrounds are warm paper; text is a warm near-black, never #000" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans)}.ramp{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden}.ramp div{flex:1;height:76px;display:flex;align-items:flex-end;padding:8px}.ramp span{font-size:10.5px;font-weight:600;letter-spacing:.02em}.lbl{display:flex;margin-top:8px}.lbl span{flex:1;font-size:10.5px;color:var(--text-faint);letter-spacing:.02em}</style></head><body>
<div class="ramp"><div style="background:var(--white);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div style="background:var(--paper)"></div><div style="background:var(--paper-sunk)"></div><div style="background:var(--paper-deep)"></div><div style="background:var(--ink-25)"></div><div style="background:var(--ink-60)"><span style="color:#fff">60</span></div><div style="background:var(--ink)"><span style="color:var(--paper)">ink</span></div></div>
<div class="lbl"><span>FFFFFF</span><span>FDF6EE</span><span>F7EDE1</span><span>F0E2D1</span><span>BBB0A3</span><span>6F6459</span><span>1E1913</span></div></body></html>
