<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans)}.b{display:flex;gap:3px;height:26px;border-radius:var(--radius-pill);overflow:hidden}.b div{border-radius:var(--radius-pill)}.leg{display:flex;gap:20px;margin-top:14px;font-size:12.5px;color:var(--text-muted)}.leg span{display:inline-flex;align-items:center;gap:7}.leg i{width:9px;height:9px;border-radius:50%;display:block}</style></head><body>
<div class="b"><div style="flex:62;background:var(--chart-1)"></div><div style="flex:21;background:var(--chart-2)"></div><div style="flex:11;background:var(--chart-3)"></div><div style="flex:4;background:var(--chart-4)"></div><div style="flex:2;background:var(--chart-5)"></div></div>
<div class="leg"><span><i style="background:var(--chart-1)"></i>chart-1</span><span><i style="background:var(--chart-2)"></i>chart-2</span><span><i style="background:var(--chart-3)"></i>chart-3</span><span><i style="background:var(--chart-4)"></i>chart-4</span><span><i style="background:var(--chart-5)"></i>chart-5</span><span><i style="background:var(--chart-track)"></i>track</span></div></body></html>
