<!-- @dsCard group="Colors" viewport="700x170" name="Money semantics" subtitle="Gain is pine, loss is deepened clay, unclaimed is apricot" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-sans)}.row{display:flex;gap:12px}.chip{flex:1;border-radius:var(--radius-md);padding:14px 16px}.chip .k{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.75}.chip .v{font-family:var(--font-display);font-size:28px;margin-top:6px;font-variant-numeric:tabular-nums}.note{margin-top:12px;font-size:12.5px;color:var(--text-faint)}</style></head><body>
<div class="row">
<div class="chip" style="background:var(--data-gain-bg);color:var(--data-gain)"><div class="k">Gain</div><div class="v">+$412</div></div>
<div class="chip" style="background:var(--data-loss-bg);color:var(--data-loss)"><div class="k">Loss</div><div class="v">−$78</div></div>
<div class="chip" style="background:var(--data-attention-bg);color:var(--apricot-600)"><div class="k">Unclaimed</div><div class="v">$1,240</div></div>
<div class="chip" style="background:var(--bg-sunk);color:var(--data-neutral)"><div class="k">Neutral</div><div class="v">$505</div></div>
</div>
<div class="note">Loss uses clay-600, never clay-500 — the primary action colour must never read as “you lost money”.</div></body></html>
