<!-- @dsCard group="FINBUDDY web app" viewport="1280x900" name="App — overview" subtitle="The signed-in view: balance, holdings, unclaimed match, Fin" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>FINBUDDY — web app</title><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><script src="data.js"></script><style>body{margin:0;background:var(--bg-page)}.app{min-height:100vh;display:flex;flex-direction:column}.body{display:flex;flex:1;align-items:stretch}.main{flex:1;padding:32px var(--page-gutter) 72px;max-width:var(--page-max)}@media(max-width:900px){.rail{display:none}.main{padding:24px var(--page-gutter-sm) 56px}}</style></head><body><div id="root"></div>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="MatchWalkthrough.jsx"></script>
<script type="text/babel" src="AskFin.jsx"></script>
<script type="text/babel" src="Accounts.jsx"></script>
<script type="text/babel" src="LinkAccount.jsx"></script>
<script type="text/babel">
const { TopNav, SideNav, Button, Toast, Card, Rule, BuddyAvatar } = window.FINBUDDYDesignSystem_3b7855;
const NAV = [{label:"Overview",icon:"home"},{label:"What you own",icon:"layers"},{label:"Match",icon:"gift",badge:"1"},{label:"Ask Fin",icon:"message-circle"},{label:"Accounts",icon:"settings"}];
function App(){
  const [view,setView]=React.useState("Overview");
  const [seed,setSeed]=React.useState(null);
  const [linking,setLinking]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const go=(v)=>{setLinking(false);setView(v)};
  const ask=(q)=>{setSeed(q);setView("Ask Fin")};
  const body = linking
    ? <LinkAccount onCancel={()=>setLinking(false)} onDone={()=>{setLinking(false);setToast("Vanguard account linked.");setTimeout(()=>setToast(null),4000)}}/>
    : view==="Match" ? <MatchWalkthrough onDone={()=>go("Overview")}/>
    : view==="Ask Fin" ? <AskFin seed={seed} key={seed||"fresh"}/>
    : view==="Accounts" ? <Accounts onLink={()=>setLinking(true)}/>
    : <Overview onStart={()=>go("Match")} onAsk={ask}/>;
  return <div className="app">
    <TopNav items={["Overview","What you own","Match","Ask Fin"]} active={view} onSelect={go}
      right={<div style={{display:'flex',gap:10,alignItems:'center'}}><Button size="sm" variant="secondary" iconLeft="plus" onClick={()=>setLinking(true)}>Link account</Button><span style={{width:32,height:32,borderRadius:'50%',background:'var(--paper-deep)',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:600,color:'var(--text-muted)'}}>M</span></div>}/>
    <div className="body">
      <div className="rail" style={{display:'flex'}}><SideNav items={NAV} active={view} onSelect={go} footer={<Card tone="warm" elevation={0} padding={16} style={{display:'flex',gap:10,alignItems:'flex-start'}}><BuddyAvatar size={26}/><span style={{fontSize:12.5,lineHeight:1.5,color:'var(--text-muted)'}}>Fin last read your accounts 2 hours ago.</span></Card>}/></div>
      <main className="main">{body}</main>
    </div>
    {toast?<div style={{position:'fixed',left:0,right:0,bottom:28,display:'flex',justifyContent:'center',zIndex:60}}><Toast tone="success" onClose={()=>setToast(null)}>{toast}</Toast></div>:null}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
